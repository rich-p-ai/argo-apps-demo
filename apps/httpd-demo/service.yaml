# HTTPD Demo Service
apiVersion: v1
kind: Service
metadata:
  name: httpd-demo
  namespace: httpd-demo
  labels:
    app: httpd-demo
    app.kubernetes.io/name: httpd-demo
spec:
  selector:
    app: httpd-demo
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
  type: ClusterIP

