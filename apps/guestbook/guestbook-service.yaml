# Guestbook Frontend Service
apiVersion: v1
kind: Service
metadata:
  name: guestbook
  namespace: guestbook
  labels:
    app: guestbook
    app.kubernetes.io/name: guestbook
    app.kubernetes.io/component: frontend
spec:
  selector:
    app: guestbook
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
