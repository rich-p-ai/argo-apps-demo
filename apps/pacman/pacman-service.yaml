# Pacman Application Service
apiVersion: v1
kind: Service
metadata:
  name: pacman
  namespace: pacman
  labels:
    app: pacman
    app.kubernetes.io/name: pacman
    app.kubernetes.io/component: frontend
spec:
  selector:
    app: pacman
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP

