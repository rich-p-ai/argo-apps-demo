# MongoDB Deployment for Pacman high scores
# Uses bitnami mongodb which is OpenShift compatible
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: pacman
  labels:
    app: mongo
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
        app.kubernetes.io/name: mongodb
    spec:
      containers:
        - name: mongo
          image: bitnami/mongodb:4.4
          env:
            - name: MONGODB_ROOT_PASSWORD
              value: admin
            - name: MONGODB_USERNAME
              value: pacman
            - name: MONGODB_PASSWORD
              value: pacman
            - name: MONGODB_DATABASE
              value: pacman
          ports:
            - containerPort: 27017
              name: mongo
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: mongo-data
              mountPath: /bitnami/mongodb
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - mongo --eval "db.adminCommand('ping')" --quiet
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - mongo --eval "db.adminCommand('ping')" --quiet
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongo-storage
