# MongoDB Deployment for Pacman high scores
# Uses the official mongo image with emptyDir volume
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: pacman
  labels:
    app: mongo
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
        app.kubernetes.io/name: mongodb
    spec:
      containers:
        - name: mongo
          image: docker.io/mongo:5.0
          args: ["--bind_ip_all"]
          ports:
            - containerPort: 27017
              name: mongo
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "mongosh --eval 'db.runCommand(\"ping\").ok' localhost:27017/test --quiet"
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "mongosh --eval 'db.runCommand(\"ping\").ok' localhost:27017/test --quiet"
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: mongo-data
          emptyDir: {}
