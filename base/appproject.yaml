# ArgoCD AppProject for Demo Applications
# This project provides RBAC and source/destination restrictions
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: demo-apps
  namespace: openshift-gitops
  labels:
    app-of-apps: demo-apps
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: "Demo Applications deployed via App of Apps pattern"
  
  # Allow manifests from the demo repo
  sourceRepos:
    - https://github.com/rich-p-ai/argo-apps-demo.git
  
  # Destination clusters and namespaces
  # Deploy to local cluster (ct1)
  destinations:
    - namespace: httpd-demo
      server: https://kubernetes.default.svc
    - namespace: pacman
      server: https://kubernetes.default.svc
    - namespace: guestbook
      server: https://kubernetes.default.svc
    - namespace: openshift-gitops
      server: https://kubernetes.default.svc
  
  # Allow cluster-scoped resources
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: route.openshift.io
      kind: Route
  
  # Allow all namespaced resources
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  
  # Notifications for sync status
  # annotations:
  #   notifications.argoproj.io/subscribe.on-sync-failed.slack: demo-apps
  #   notifications.argoproj.io/subscribe.on-health-degraded.slack: demo-apps

